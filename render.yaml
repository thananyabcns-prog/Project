services:
  - type: web
    name: hos-backend
    runtime: node
    rootDir: back
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: mongodb
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: hos
      - key: MONGODB_COLLECTION
        value: patient_records
